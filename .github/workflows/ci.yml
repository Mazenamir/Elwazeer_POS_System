name: Elwazeer POS System CI & Release Gates

on:
  push:
    branches: [ master, 'audit/**', 'release/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-and-packaging:
    name: Frontend Build & Packaging Audit (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Client Production Build (Vite)
        run: npm run build

      - name: Verify Package & Packaging Integrity
        run: npm run verify:package
        env:
          CI: 'true'

      - name: Run Auto-Updater Lifecycle & Concurrency Tests
        run: npm run test:updater
        env:
          NODE_ENV: test
          CI: 'true'

      - name: Run Auto-Updater Mathematical Invariants
        run: node scratch/test_auto_updater.js

      - name: Verify Frontend Pages & Navigation Wiring
        run: node scratch/verify_all_pages_and_routes.js

  backend-and-invariants:
    name: Database Migrations & Invariants Suites (Ubuntu + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: pos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Client Production Build (Vite)
        run: npm run build

      - name: Run Database Migrations
        run: node -e "const { runMigrations } = require('./src/server/database/migrator'); runMigrations().then(() => { console.log('Migrations completed successfully'); process.exit(0); }).catch(e => { console.error('Migration failed:', e); process.exit(1); })"
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres_password
          DB_NAME: pos_db
          SYNC_API_KEY: BebyoonSecretKey2026

      - name: Run Auto-Updater Lifecycle & Concurrency Tests
        run: npm run test:updater
        env:
          NODE_ENV: test
          CI: 'true'

      - name: Run Cash Drawer & Payroll Invariants Tests
        run: npm run test:invariants
        env:
          NODE_ENV: test
          CI: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres_password
          DB_NAME: pos_db
          SYNC_API_KEY: BebyoonSecretKey2026

      - name: Run Full Master Regression Suites
        run: npm test
        env:
          NODE_ENV: test
          CI: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres_password
          DB_NAME: pos_db
          SYNC_API_KEY: BebyoonSecretKey2026
